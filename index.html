<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gift Vault">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Gift Vault</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17181c;--muted:#747984;--line:#e5e7eb;--soft:#eef0f3;--danger:#d92d20;--warn:#a15c00;--ok:#087443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:20px 18px 8px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:var(--muted)}h1{font-size:30px;margin:4px 0;font-weight:800}.iconbtn{border:0;background:var(--card);width:42px;height:42px;border-radius:14px;font-size:19px}
main{padding:12px 16px}.hero{background:#111318;color:#fff;border-radius:24px;padding:22px}.label{font-size:11px;color:#aeb3be;text-transform:uppercase;letter-spacing:.08em}.balance{font-size:39px;font-weight:850;margin:3px 0 16px}.stats{display:flex;gap:8px}.stat{background:#ffffff12;border-radius:14px;padding:10px;flex:1}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:#bfc3cb}.section{margin-top:23px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}.sectionhead h2{font-size:18px;margin:0}.sectionhead button{border:0;background:none;color:var(--muted);font-weight:650}.alert,.listcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:11px}.dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}.name{font-weight:750}.sub,.mini{font-size:11px;color:var(--muted);margin-top:3px}.amount,.right{margin-left:auto;text-align:right;font-weight:750}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;min-height:145px;position:relative}.brand{font-weight:780}.cardamount{font-size:25px;font-weight:850;margin-top:18px}.pill{position:absolute;right:12px;top:12px;font-size:10px;padding:5px 7px;border-radius:9px;background:var(--soft);color:var(--muted)}.fab{position:fixed;right:max(20px,calc((100vw - 560px)/2 + 20px));bottom:86px;width:58px;height:58px;border:0;border-radius:20px;background:#111318;color:#fff;font-size:30px;box-shadow:0 10px 25px #0003}.nav{position:fixed;bottom:0;left:0;right:0;height:74px;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.navin{max-width:560px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:var(--muted);font-size:10px;padding:8px 12px}.nav button.active{color:var(--text);font-weight:750}.ico{display:block;font-size:20px;margin-bottom:3px}.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet.show{display:flex}.panel{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:26px 26px 0 0;padding:20px;max-height:93vh;overflow:auto}.grab{width:38px;height:4px;background:#ccc;border-radius:9px;margin:0 auto 17px}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0 0 16px}.close{border:0;background:var(--soft);border-radius:12px;width:38px;height:38px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;outline:none}textarea{min-height:72px}.primary{width:100%;border:0;border-radius:15px;background:#111318;color:#fff;padding:14px;font-weight:750;margin-top:17px}.secondary{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);padding:13px;font-weight:700;margin-top:8px}.dangerbtn{background:#d92d20;color:#fff;border-color:#d92d20}.pageTitle{font-size:27px;font-weight:820;margin:8px 4px 16px}.filterrow{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filterrow button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;color:var(--text)}.filterrow .active{background:#111318;color:#fff}.search{margin-bottom:10px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:17px;margin-bottom:9px}.toggle input{width:auto}.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#111318;color:#fff;padding:11px 15px;border-radius:14px;font-size:12px;z-index:30;display:none}.toast.show{display:block}.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:25px}.lockbox{width:min(420px,100%);text-align:center}.lockicon{font-size:48px}.pin{font-size:26px;text-align:center;letter-spacing:.5em}.small{font-size:11px;color:var(--muted);line-height:1.45}.install{display:none}.notice{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:17px;margin-bottom:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c10;--card:#15171c;--text:#f4f5f7;--muted:#969ba6;--line:#292c34;--soft:#20232a}.nav{background:#121419ed}.hero{background:#f2f3f5;color:#111318}.hero .label,.stat span{color:#666b76}}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="lockbox"><div class="lockicon">🔐</div><h2>Gift Vault</h2><p id="lockText">Create a vault PIN to protect your cards.</p><input id="pin1" class="pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••"><input id="pin2" class="pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••" style="display:none;margin-top:10px"><button class="primary" onclick="unlock()">Continue</button><p class="small">Local-only vault. Your PIN is not recoverable if forgotten.</p></div></div>
<div class="app"><header class="top"><div><div class="eyebrow">Private • Local • Encrypted</div><h1 id="title">Gift Vault</h1></div><button class="iconbtn" onclick="showPage('settings')">⚙️</button></header><main id="main"></main><div class="toast" id="toast"></div></div>
<nav class="nav"><div class="navin"><button class="active" onclick="showPage('home',this)"><span class="ico">⌂</span>Home</button><button onclick="showPage('cards',this)"><span class="ico">🎁</span>Cards</button><button onclick="showPage('expiry',this)"><span class="ico">⏰</span>Expiry</button><button onclick="showPage('settings',this)"><span class="ico">⚙</span>Settings</button></div></nav>
<button class="fab" onclick="openAdd()">＋</button><div class="sheet" id="sheet"><div class="panel"><div class="grab"></div><div id="sheetBody"></div></div></div>
<script>
const STORE='gift-vault-v4',META='gift-vault-v4-meta';let vault=[],masterKey=null,filter='all',search='';
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){let a=new Uint8Array(buf),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}
function unb64(s){let bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function derive(pin,salt){let k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj,key){let iv=crypto.getRandomValues(new Uint8Array(12));let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),data:b64(ct)}}
async function decrypt(pkg,key){let pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.data));return JSON.parse(dec.decode(pt))}
async function save(){localStorage.setItem(STORE,JSON.stringify(await encrypt(vault,masterKey)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function days(c){return Math.ceil((new Date(c.expiry+'T23:59:59')-new Date())/86400000)}
function state(c){if(c.remaining<=0)return['Used','ok'];let d=days(c);if(d<0)return['Expired','danger'];if(d<=7)return[d+'d','danger'];if(d<=30)return[d+'d','warn'];return[d+'d','ok']}
async function unlock(){let meta=JSON.parse(localStorage.getItem(META)||'null'),p=pin1.value;if(!meta){if(p.length<4)return alert('Use at least 4 digits.');if(pin2.style.display==='none'){pin2.style.display='block';document.getElementById('lockText').textContent='Enter the PIN again to confirm.';return}if(p!==pin2.value)return alert('PINs do not match.');let salt=crypto.getRandomValues(new Uint8Array(16));masterKey=await derive(p,salt);localStorage.setItem(META,JSON.stringify({salt:b64(salt),version:4}));vault=[];await save();lock.style.display='none';home()}else{try{masterKey=await derive(p,unb64(meta.salt));vault=await decrypt(JSON.parse(localStorage.getItem(STORE)),masterKey);lock.style.display='none';home()}catch(e){alert('Incorrect PIN or corrupted vault.')}}}
function home(){let total=vault.reduce((a,c)=>a+(+c.remaining||0),0),active=vault.filter(c=>c.remaining>0&&days(c)>=0).length,soon=vault.filter(c=>c.remaining>0&&days(c)>=0&&days(c)<=30).sort((a,b)=>days(a)-days(b));document.getElementById('main').innerHTML=`<section class="hero"><div class="label">Total remaining value</div><div class="balance">₹${total.toLocaleString('en-IN')}</div><div class="stats"><div class="stat"><b>${active}</b><span>Active</span></div><div class="stat"><b>${soon.length}</b><span>Expiring</span></div><div class="stat"><b>${vault.length}</b><span>Total cards</span></div></div></section><section class="section"><div class="sectionhead"><h2>⚠️ Expiring soon</h2><button onclick="showPage('expiry')">View all</button></div>${soon.slice(0,4).map(c=>`<div class="alert" onclick="view(${c.id})"><span class="dot"></span><div><div class="name">${esc(c.brand)}</div><div class="sub">${state(c)[0]} · ${esc(c.expiry)}</div></div><div class="amount">₹${(+c.remaining).toLocaleString('en-IN')}</div></div>`).join('')||'<div class="empty">Nothing expiring within 30 days.</div>'}</section><section class="section"><div class="sectionhead"><h2>My cards</h2><button onclick="showPage('cards')">View all</button></div><div class="cards">${vault.slice(-4).reverse().map(c=>`<div class="card" onclick="view(${c.id})"><span class="pill">${state(c)[0]}</span><div class="brand">${esc(c.brand)}</div><div class="mini">${esc(c.source||'Gift card')}</div><div class="cardamount">₹${(+c.remaining).toLocaleString('en-IN')}</div><div class="mini">Expires ${esc(c.expiry)}</div></div>`).join('')||'<div class="empty">Add your first card.</div>'}</div></section>`}
function showPage(p,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.querySelector('.fab').style.display=p==='settings'?'block':'block';document.getElementById('title').textContent=p==='home'?'Gift Vault':p==='cards'?'My Cards':p==='expiry'?'Expiry':'Settings';if(p==='home')home();if(p==='cards')cardsPage();if(p==='expiry')expiryPage();if(p==='settings')settingsPage()}
function cardsPage(){document.getElementById('main').innerHTML=`<div class="pageTitle">My cards</div><input class="search" placeholder="🔎 Search brand, source or notes" value="${esc(search)}" oninput="search=this.value;cardsPage()"><div class="filterrow"><button class="${filter==='all'?'active':''}" onclick="filter='all';cardsPage()">All</button><button class="${filter==='active'?'active':''}" onclick="filter='active';cardsPage()">Active</button><button class="${filter==='partial'?'active':''}" onclick="filter='partial';cardsPage()">Partial</button><button class="${filter==='used'?'active':''}" onclick="filter='used';cardsPage()">Used</button><button class="${filter==='expired'?'active':''}" onclick="filter='expired';cardsPage()">Expired</button></div>${filtered().map(c=>`<div class="listcard" onclick="view(${c.id})"><div><b>${esc(c.brand)}</b><div class="mini">${state(c)[0]} · ${esc(c.expiry)}</div></div><div class="right">₹${(+c.remaining).toLocaleString('en-IN')}<div class="mini">of ₹${(+c.amount).toLocaleString('en-IN')}</div></div></div>`).join('')||'<div class="empty">No matching cards.</div>'}`}
function filtered(){let q=search.toLowerCase();return vault.filter(c=>(!q||[c.brand,c.source,c.notes].join(' ').toLowerCase().includes(q))&&(filter==='all'||filter==='active'&&(c.remaining>0&&days(c)>=0)||filter==='partial'&&(c.remaining>0&&c.remaining<c.amount)||filter==='used'&&c.remaining<=0||filter==='expired'&&days(c)<0&&c.remaining>0)).sort((a,b)=>days(a)-days(b))}
function expiryPage(){document.getElementById('main').innerHTML='<div class="pageTitle">Expiry center</div>'+[...vault].sort((a,b)=>days(a)-days(b)).map(c=>`<div class="listcard" onclick="view(${c.id})"><div><b>${esc(c.brand)}</b><div class="mini">Expires ${esc(c.expiry)}</div></div><div class="right ${state(c)[1]}">${state(c)[0]}<div class="mini">₹${(+c.remaining).toLocaleString('en-IN')}</div></div></div>`).join('')||'<div class="empty">No cards yet.</div>'}
function settingsPage(){let installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;document.getElementById('main').innerHTML=`<div class="pageTitle">Settings</div><div class="notice"><b>📱 ${installed?'Installed as an iPhone web app':'Install on iPhone'}</b><div class="mini">${installed?'Gift Vault is running in standalone mode.':'In Safari, use Share → Add to Home Screen → Open as Web App.'}</div></div><div class="toggle"><div><b>Encrypted vault</b><div class="mini">AES-GCM 256-bit encryption</div></div><span>🔐</span></div><div class="toggle"><div><b>Expiry reminders</b><div class="mini">Local reminder center is active. True background push needs a push endpoint.</div></div><span>⏰</span></div><div class="listcard" onclick="reminders()"><div><b>Reminder center</b><div class="mini">See cards needing attention</div></div><div>›</div></div><div class="listcard" onclick="exportBackup()"><div><b>Export encrypted backup</b><div class="mini">Save encrypted vault data</div></div><div>›</div></div><div class="listcard" onclick="importBackup()"><div><b>Restore encrypted backup</b><div class="mini">Requires your vault PIN</div></div><div>›</div></div><div class="listcard" onclick="lockVault()"><div><b>Lock vault now</b></div><div>›</div></div><div class="listcard" onclick="wipe()"><div><b>Delete vault permanently</b></div><div class="danger">›</div></div>`}
function reminders(){let a=vault.filter(c=>c.remaining>0&&days(c)>=0&&days(c)<=30).sort((x,y)=>days(x)-days(y));document.getElementById('main').innerHTML='<div class="pageTitle">Reminder center</div><div class="notice">🔔 This local reminder center calculates upcoming expiry dates whenever the vault is opened.</div>'+(a.map(c=>`<div class="listcard" onclick="view(${c.id})"><div><b>${esc(c.brand)}</b><div class="mini">Expires ${esc(c.expiry)}</div></div><div class="right">${state(c)[0]}<div class="mini">₹${(+c.remaining).toLocaleString('en-IN')}</div></div></div>`).join('')||'<div class="empty">Nothing needs attention.</div>')}
function openAdd(){document.getElementById('sheetBody').innerHTML=`<div class="panelhead"><h2>Add gift card</h2><button class="close" onclick="closeSheet()">✕</button></div><form onsubmit="add(event)"><label>Brand *</label><input id="brand" required placeholder="Amazon"><label>Original amount *</label><input id="amount" required type="number" min="0" step=".01" placeholder="500"><label>Remaining balance *</label><input id="remaining" required type="number" min="0" step=".01" placeholder="500"><label>Gift card code *</label><input id="code" required class="codebox" placeholder="XXXX-XXXX-XXXX"><label>PIN</label><input id="cardpin" type="password" class="codebox"><label>Expiry date *</label><input id="expiry" required type="date"><label>Purchase date</label><input id="purchaseDate" type="date"><label>Source</label><input id="source" placeholder="SBI Rewards / Amazon / etc."><label>Notes</label><textarea id="notes"></textarea><button class="primary">Add to encrypted vault</button></form>`;sheet.classList.add('show')}
async function add(e){e.preventDefault();vault.push({id:Date.now(),brand:brand.value,amount:+amount.value,remaining:+remaining.value,code:code.value,pin:cardpin.value,expiry:expiry.value,purchaseDate:purchaseDate.value,source:source.value,notes:notes.value});await save();closeSheet();home();toast('Encrypted & saved')}
function view(id){let c=vault.find(x=>x.id===id);sheetBody.innerHTML=`<div class="panelhead"><h2>${esc(c.brand)}</h2><button class="close" onclick="closeSheet()">✕</button></div><div class="hero"><div class="label">Remaining</div><div class="balance">₹${(+c.remaining).toLocaleString('en-IN')}</div><div class="stats"><div class="stat"><b>${state(c)[0]}</b><span>Expiry</span></div><div class="stat"><b>₹${(+c.amount).toLocaleString('en-IN')}</b><span>Original</span></div></div></div><label>Gift card code</label><input readonly class="codebox" value="•••• •••• ${esc(String(c.code||'').slice(-4))}"><button class="secondary" onclick="reveal(${c.id})">Reveal & copy code</button><label>PIN</label><input readonly type="password" value="${esc(c.pin||'')}"><label>Expiry</label><input readonly value="${esc(c.expiry)}"><label>Source</label><input readonly value="${esc(c.source||'')}"><button class="primary" onclick="updateBalance(${c.id})">Update remaining balance</button><button class="secondary dangerbtn" onclick="del(${c.id})">Delete card</button>`;sheet.classList.add('show')}
function reveal(id){let c=vault.find(x=>x.id===id);navigator.clipboard?.writeText(c.code).then(()=>toast('Code copied')).catch(()=>alert(c.code))}
async function updateBalance(id){let c=vault.find(x=>x.id===id),v=prompt('New remaining balance',c.remaining);if(v!==null&&!isNaN(v)){c.remaining=Math.max(0,+v);await save();closeSheet();home();toast('Balance updated')}}
async function del(id){if(confirm('Delete this gift card?')){vault=vault.filter(c=>c.id!==id);await save();closeSheet();home();toast('Card deleted')}}
function closeSheet(){sheet.classList.remove('show')}
async function exportBackup(){let meta=JSON.parse(localStorage.getItem(META));let out={format:'Gift Vault encrypted backup',version:4,meta,payload:JSON.parse(localStorage.getItem(STORE))};let blob=new Blob([JSON.stringify(out)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gift-vault-encrypted-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importBackup(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result),p=prompt('Enter vault PIN');let k=await derive(p,unb64(d.meta.salt)),data=await decrypt(d.payload,k);localStorage.setItem(META,JSON.stringify(d.meta));localStorage.setItem(STORE,JSON.stringify(d.payload));masterKey=k;vault=data;home();toast('Backup restored')}catch(e){alert('Invalid backup or PIN')}};r.readAsText(i.files[0])};i.click()}
function lockVault(){masterKey=null;vault=[];lock.style.display='flex';pin1.value='';pin2.value='';pin2.style.display='none';lockText.textContent='Enter your vault PIN to unlock.'}
function wipe(){if(confirm('Permanently delete the entire vault?')){localStorage.removeItem(STORE);localStorage.removeItem(META);location.reload()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function init(){let meta=JSON.parse(localStorage.getItem(META)||'null');if(meta){lockText.textContent='Enter your vault PIN to unlock.';pin2.style.display='none'}else pin2.style.display='block'})();
</script>
</body></html>
